<style>
:root {
  --primary: #2980b9;
  --primary-dark: #1a5276;
  --success: #27ae60;
  --danger: #e74c3c;
  --warning: #f39c12;
  --bg: #f0f2f5;
  --card: #fff;
  --text: #2c3e50;
  --text-light: #7f8c8d;
  --border: #dfe6e9;
  --sidebar-w: 220px;
  --header-h: 56px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }

/* Sidebar */
.sidebar {
  position: fixed; left:0; top:0; bottom:0; width: var(--sidebar-w);
  background: var(--primary-dark); color:#fff; padding-top:16px; z-index:100;
  overflow-y:auto; transition: transform .3s;
}
.sidebar h2 { font-size:18px; padding:0 20px 12px; border-bottom:1px solid rgba(255,255,255,.15); margin-bottom:8px; }
.sidebar .nav-item {
  display:block; padding:10px 20px; cursor:pointer; font-size:14px;
  transition: background .2s; border:none; background:none; color:#fff; width:100%; text-align:left;
}
.sidebar .nav-item:hover, .sidebar .nav-item.active { background: rgba(255,255,255,.15); }
.sidebar .nav-item.active { border-left:3px solid #fff; font-weight:600; }

/* Mobile hamburger */
.hamburger {
  display:none; position:fixed; top:10px; left:10px; z-index:200;
  background:var(--primary-dark); color:#fff; border:none; padding:8px 12px; border-radius:6px; font-size:20px; cursor:pointer;
}
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:99; }

/* Main area */
.main { margin-left: var(--sidebar-w); min-height:100vh; }
.header {
  background: var(--card); min-height: var(--header-h); display:flex; align-items:center;
  padding:0 24px; border-bottom:1px solid var(--border); gap:8px; flex-wrap:wrap;
  position:sticky; top:0; z-index:50;
}
.tab-btn {
  padding:8px 16px; border:none; background:none; cursor:pointer; font-size:14px; color:var(--text-light);
  border-bottom:2px solid transparent; transition: all .2s;
}
.tab-btn:hover { color:var(--text); }
.tab-btn.active { color:var(--primary); border-bottom-color:var(--primary); font-weight:600; }
.content { padding:24px; max-width:900px; margin:0 auto; }

/* Progress bar */
.progress-bar { background:var(--border); border-radius:10px; height:8px; margin-bottom:16px; overflow:hidden; }
.progress-bar .fill { height:100%; background:var(--success); border-radius:10px; transition: width .4s; }
.stats { display:flex; gap:16px; margin-bottom:20px; font-size:14px; color:var(--text-light); flex-wrap:wrap; }
.stats span { background:var(--card); padding:4px 12px; border-radius:20px; }

/* Controls */
.controls { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
.btn {
  padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-size:13px; transition:all .2s;
}
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:#2471a3; }
.btn-success { background:var(--success); color:#fff; }
.btn-success:hover { background:#219a52; }
.btn-warning { background:var(--warning); color:#fff; }
.btn-warning:hover { background:#d68910; }
.btn-danger { background:var(--danger); color:#fff; }
.btn-danger:hover { background:#c0392b; }
.btn-outline { background:none; border:1px solid var(--border); color:var(--text); }
.btn-outline:hover { background:var(--bg); }
.btn-outline.active { border-color:var(--primary); color:var(--primary); background:rgba(41,128,185,.08); }

/* Card */
.card {
  background:var(--card); border-radius:12px; padding:24px; margin-bottom:16px;
  box-shadow:0 1px 3px rgba(0,0,0,.08); border:1px solid var(--border);
}
.card .label { font-size:12px; color:var(--text-light); margin-bottom:4px; }
.card .zh { font-size:18px; margin-bottom:12px; line-height:1.5; }
.card .input-row { display:flex; gap:8px; align-items:center; }
.card input[type=text] {
  flex:1; padding:10px 14px; border:2px solid var(--border); border-radius:8px; font-size:16px;
  outline:none; transition: border-color .2s;
}
.card input[type=text]:focus { border-color:var(--primary); }
.card input.correct { border-color:var(--success); background:#eafaf1; }
.card input.wrong { border-color:var(--danger); background:#fdedec; }
.answer-display { margin-top:8px; font-size:14px; }
.answer-display.correct { color:var(--success); }
.answer-display.wrong { color:var(--danger); }

/* TTS button */
.tts-btn {
  width:40px; height:40px; border:none; background:var(--primary); color:#fff;
  border-radius:50%; font-size:18px; cursor:pointer; flex-shrink:0; transition:background .2s;
}
.tts-btn:hover { background:#2471a3; }

/* Flashcards */
.fc-types { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.fc-wrap { perspective:1200px; margin:8px auto 16px; max-width:560px; }
.fc-card { position:relative; width:100%; min-height:260px; cursor:pointer; }
.fc-inner { position:relative; width:100%; min-height:260px; transition:transform .5s; transform-style:preserve-3d; }
.fc-card.flipped .fc-inner { transform:rotateY(180deg); }
.fc-face {
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  padding:28px; border-radius:16px; border:1px solid var(--border);
  box-shadow:0 2px 10px rgba(0,0,0,.08); background:var(--card); text-align:center;
}
.fc-front { }
.fc-back { transform:rotateY(180deg); background:#f7fbff; }
.fc-face .fc-tag { position:absolute; top:12px; left:16px; font-size:12px; color:var(--text-light); }
.fc-face .fc-side { position:absolute; top:12px; right:16px; font-size:12px; color:var(--primary); }
.fc-face .fc-main { font-size:26px; line-height:1.4; font-weight:600; color:var(--text); }
.fc-face .fc-main.small { font-size:20px; font-weight:500; }
.fc-face .fc-sub { font-size:15px; color:var(--text-light); line-height:1.5; }
.fc-face .fc-exp { font-size:13px; color:#7d6608; background:#fef9e7; padding:10px 14px; border-radius:8px; max-width:100%; }
.fc-face .fc-hint { position:absolute; bottom:12px; font-size:12px; color:var(--text-light); }
.fc-grade { display:flex; gap:12px; justify-content:center; margin-bottom:8px; }
.fc-grade .btn { padding:12px 28px; font-size:15px; }
.fc-summary { text-align:center; padding:48px 20px; }
.fc-summary .big { font-size:40px; font-weight:700; color:var(--primary); }

/* Reading (朗读训练) */
.read-unit { font-size:17px; margin:18px 0 8px; display:flex; justify-content:space-between; align-items:baseline; }
.read-unit span { font-size:13px; color:var(--text-light); font-weight:400; }
.read-card {
  background:var(--card); border:1px solid var(--border); border-left:4px solid var(--border);
  border-radius:12px; padding:16px; margin-bottom:12px; transition:border-color .2s;
}
.read-card.done { border-left-color:var(--success); }
.read-card.recording { border-color:var(--danger); border-left-color:var(--danger); }
.read-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
.read-title { font-size:16px; font-weight:600; }
.read-dur { font-size:13px; color:var(--text-light); }
.read-card audio { width:100%; height:36px; margin-bottom:10px; }
.read-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.btn.sm { padding:5px 10px; font-size:12px; }
.read-msg { margin-top:8px; font-size:13px; color:var(--warning); }
.read-card.recording .read-title::after {
  content:' ● 录音中'; color:var(--danger); font-size:13px; font-weight:400; animation:read-pulse 1s infinite;
}
@keyframes read-pulse { 50% { opacity:.25; } }

/* Grammar */
.grammar-card { background:var(--card); border-radius:12px; padding:20px; margin-bottom:12px; border:1px solid var(--border); }
.grammar-card .question { font-size:16px; margin-bottom:12px; line-height:1.6; }
.grammar-card .options { display:flex; flex-direction:column; gap:8px; }
.grammar-card .option-btn {
  padding:10px 16px; border:2px solid var(--border); border-radius:8px; background:var(--card);
  cursor:pointer; font-size:14px; text-align:left; transition:all .2s;
}
.grammar-card .option-btn:hover { border-color:var(--primary); background:rgba(41,128,185,.05); }
.grammar-card .option-btn.selected-correct { border-color:var(--success); background:#eafaf1; }
.grammar-card .option-btn.selected-wrong { border-color:var(--danger); background:#fdedec; }
.grammar-card .option-btn.show-correct { border-color:var(--success); background:#eafaf1; }
.grammar-card .option-btn.disabled { pointer-events:none; opacity:.7; }
.grammar-card .explanation { margin-top:10px; padding:10px; background:#fef9e7; border-radius:6px; font-size:13px; color:#7d6608; display:none; }
.grammar-card .fill-input { width:200px; padding:8px 12px; border:2px solid var(--border); border-radius:6px; font-size:15px; outline:none; }
.grammar-card .fill-input:focus { border-color:var(--primary); }
.grammar-card .fill-input.correct { border-color:var(--success); background:#eafaf1; }
.grammar-card .fill-input.wrong { border-color:var(--danger); background:#fdedec; }

/* Print styles */
@media print {
  .sidebar, .hamburger, .overlay, .header, .controls, .progress-bar, .stats, .btn, .tts-btn, .no-print { display:none!important; }
  .main { margin-left:0!important; }
  .content { padding:10px; max-width:100%; }
  .print-sheet { display:block!important; }
  .print-sheet h2 { font-size:16px; margin:16px 0 8px; border-bottom:1px solid #333; padding-bottom:4px; }
  .print-sheet .print-item { padding:8px 0; border-bottom:1px dashed #ccc; page-break-inside:avoid; }
  .print-sheet .print-item .prompt { font-size:14px; }
  .print-sheet .print-item .write-line { border-bottom:1px solid #999; height:32px; margin-top:4px; }
  .print-grid { display:grid; gap:4px 12px; }
  .print-grid.cols-5 { grid-template-columns:repeat(5, 1fr); }
  .print-grid.cols-3 { grid-template-columns:repeat(3, 1fr); }
  .print-cell { page-break-inside:avoid; padding:4px 0; }
  .print-cell .prompt { font-size:12px; }
  .print-cell .write-line { border-bottom:1px solid #999; height:24px; margin-top:2px; }
  body { background:#fff; font-size:12px; }
}
.print-sheet { display:none; }

/* Responsive */
@media (max-width:768px) {
  .sidebar { transform:translateX(-100%); }
  .sidebar.open { transform:translateX(0); }
  .overlay.show { display:block; }
  .hamburger { display:block; }
  .main { margin-left:0; }
  .header { padding:0 12px 0 50px; }
  .content { padding:16px; }
  .card .zh { font-size:16px; }
}
</style>

  {u:5, en:"I have a sweet tooth and it is hard for me to say no to cakes.", zh:"我爱吃甜食，对我来说要拒绝蛋糕是很难的。"},
  {u:5, en:"I need to get enough sleep.", zh:"我需要充足的睡眠。"},
  // Unit 6 Fashion
  {u:6, en:"Dressing is a way of life.", zh:"着装是一种生活方式。"},
  {u:6, en:"Well, it depends on the colour of our skin.", zh:"嗯，这取决于我们的肤色。"},
  {u:6, en:"Which colours go well together?", zh:"哪些颜色搭配协调？"},
  {u:6, en:"In fact, warm and cool colours make each other stand out, such as yellow and green or orange and blue.", zh:"事实上，暖色和冷色可以相互衬托，比如黄色配蓝色，或者橙色配蓝色。"},
  {u:6, en:"Some popular types are hanfu, qipao and tangzhuang.", zh:"一些受欢迎的类型有汉服、旗袍和唐装。"},
  {u:6, en:"Qipao are usually made of silk, and they feel smooth and soft.", zh:"旗袍通常由丝绸制成，摸起来柔软光滑。"},
  {u:6, en:"I think white shirts have a clean look, and white matches any other colour.", zh:"我觉得白衬衫看起来很干净，而且白色和其他任何颜色都很搭配。"},
  {u:6, en:"The jacket is not too long or too large, and it is dark blue.", zh:"这件夹克衫不长也不大，是深蓝色的。"},
  // Unit 7 Shopping
  {u:7, en:"Get your money's worth.", zh:"让你的钱花得值。"},
  {u:7, en:"They're a set of dolls in different sizes.", zh:"它们（俄罗斯套娃）是一套大小不同的娃娃。"},
  {u:7, en:"Players wear them to protect their eyes from the sun, and they're also a kind of fashion.", zh:"运动员们戴着它们（棒球帽）保护眼睛免受日光伤害，它们也是一种时尚。"},
  {u:7, en:"That will cost a lot of money.", zh:"那要花费一大笔钱。"},
  {u:7, en:"It's a good idea to save for a rainy day.", zh:"未雨绸缪是一个好主意。"},
  {u:7, en:"Do you usually get lucky money at the Spring Festival?", zh:"你通常会在春节收到压岁钱吗？"},
  {u:7, en:"Same here.", zh:"我也一样。"},
  // Unit 8 Special days

// Load progress from localStorage
function loadProgress() {

// ========== ANSWER CHECKING ==========
function normalize(s) {
  return s.toLowerCase().replace(/['']/g, "'").replace(/[""]/g, '"').replace(/\s+/g, ' ').replace(/[.,!?;:，。！？；：、]+$/g, '').trim();
}
function checkAnswer(input, expected) {
  const a = normalize(input);
  const b = normalize(expected);
  if (a === b) return true;
  // Also check without any punctuation
  const a2 = a.replace(/[^a-z0-9\s]/g, '');
  const b2 = b.replace(/[^a-z0-9\s]/g, '');
  return a2 === b2;
}

// ========== TTS ==========
// TTS: cache English voice
let _enVoice = null;
let _voicesLoaded = false;
function loadVoices() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  _voicesLoaded = true;
  // Prefer high-quality voices: Samantha (macOS), Google US English, any en-US, any en
  const prefs = [
    v => v.name.includes('Samantha'),
    v => v.name.includes('Google') && v.lang.startsWith('en'),
    v => v.name.includes('Natural') && v.lang.startsWith('en'),
    v => v.lang === 'en-US' && !v.name.includes('Compact'),
    v => v.lang === 'en-GB' && !v.name.includes('Compact'),
    v => v.lang.startsWith('en-'),
    v => v.lang.startsWith('en'),
  ];
  for (const test of prefs) {
    const found = voices.find(test);
    if (found) { _enVoice = found; return; }
  }
}
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  if (!_voicesLoaded) loadVoices();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.85;
  u.pitch = 1;
  if (_enVoice) u.voice = _enVoice;
  speechSynthesis.speak(u);
}

// ========== RENDER ==========
function render() {
  const el = document.getElementById('content');
  if (state.tab === 'print') return renderPrint(el);
  if (state.tab === 'grammar') return renderGrammar(el);
  if (state.tab === 'flashcards') return renderFlashcards(el);
  if (state.tab === 'reading') return renderReading(el);
  renderDictation(el);
}

function renderDictation(el) {
  const items = getItems(state.tab);
  if (state.random) {
    // Shuffle using Fisher-Yates
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [items[i], items[j]] = [items[j], items[i]];
    }
  }
  state.currentItems = items;

  const total = items.length;
  const getKey = (item) => `${state.tab}-${item.u}-${DATA[state.tab].indexOf(item)}`;
  const answered = items.filter(item => state.answers[getKey(item)] !== undefined).length;
  const correct = items.filter(item => state.answers[getKey(item)]?.correct).length;

  const pct = total > 0 ? Math.round(answered / total * 100) : 0;
  const tabLabel = state.tab === 'words' ? '单词' : state.tab === 'phrases' ? '词组' : '句子';

  let html = `
    <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
    <div class="stats">
      <span>共 ${total} 个${tabLabel}</span>
      <span>已完成 ${answered}/${total}</span>
      <span>正确率 ${answered > 0 ? Math.round(correct/answered*100) : 0}%</span>
    </div>
    <div class="controls">
      <button class="btn btn-outline ${state.mode==='zh2en'?'active':''}" onclick="switchMode('zh2en')">看中文写英文</button>
      <button class="btn btn-outline ${state.mode==='listen'?'active':''}" onclick="switchMode('listen')">听英文写英文</button>
      <button class="btn btn-outline ${state.random?'active':''}" onclick="toggleRandom()">随机顺序</button>
      <button class="btn btn-warning" onclick="clearTabProgress()">重做本组</button>
    </div>
  `;

  items.forEach((item, idx) => {
    const key = getKey(item);
    const answered = state.answers[key];
    const inputId = `input-${idx}`;

    html += `<div class="card" id="card-${idx}">`;
    html += `<div class="label">Unit ${item.u} · #${idx+1}</div>`;

    if (state.mode === 'zh2en') {
      html += `<div class="zh">${item.zh}</div>`;
    } else {
      html += `<div class="zh" style="color:var(--text-light);font-size:14px;">点击喇叭听英文，写出你听到的内容</div>`;
    }

    html += `<div class="input-row">`;
    if (state.mode === 'listen') {
      html += `<button class="tts-btn" onclick="speak('${item.en.replace(/'/g, "\\'")}')">🔊</button>`;
    }
    html += `<input type="text" id="${inputId}" placeholder="输入英文..."
      ${answered ? 'disabled' : ''}
      class="${answered ? (answered.correct ? 'correct' : 'wrong') : ''}"
      ${answered ? `value="${answered.userInput || ''}"` : ''}
      onkeydown="if(event.key==='Enter')submitAnswer(${idx},'${key}','${inputId}')">`;
    if (!answered) {
      html += `<button class="btn btn-primary" onclick="submitAnswer(${idx},'${key}','${inputId}')">确认</button>`;
      if (state.tab === 'sentences') {
        html += `<button class="btn btn-outline" onclick="showHint(${idx})">提示</button>`;
      }
    }
    html += `</div>`; // input-row

    if (answered) {
      if (answered.correct) {
        html += `<div class="answer-display correct">✓ 正确！</div>`;
      } else {
        html += `<div class="answer-display wrong">✗ 正确答案：${item.en}</div>`;
      }
    }

    // Hint area for sentences
    if (state.tab === 'sentences' && !answered) {
      html += `<div id="hint-${idx}" class="answer-display" style="color:var(--warning);display:none;"></div>`;
    }

    html += `</div>`; // card
  });

  if (total === 0) {
    html += `<div style="text-align:center;padding:40px;color:var(--text-light);">该单元没有此类型的内容</div>`;
  }

  el.innerHTML = html;
}

function submitAnswer(idx, key, inputId) {
  const input = document.getElementById(inputId);
  if (!input) return;
  const userInput = input.value.trim();
  if (!userInput) return;
  const item = state.currentItems[idx];
  const correct = checkAnswer(userInput, item.en);
  state.answers[key] = { correct, userInput };
  saveProgress();
  render();
  // Scroll to next unanswered
  setTimeout(() => {
    const cards = document.querySelectorAll('.card');
    for (let i = idx + 1; i < cards.length; i++) {
      const inp = cards[i].querySelector('input:not([disabled])');
      if (inp) { inp.focus(); inp.scrollIntoView({behavior:'smooth', block:'center'}); break; }
    }
  }, 100);
}

function showHint(idx) {
  const item = state.currentItems[idx];
  const hintEl = document.getElementById(`hint-${idx}`);
  if (!hintEl) return;
  const words = item.en.split(' ');
  const current = hintEl.dataset.level ? parseInt(hintEl.dataset.level) : 0;
  const next = Math.min(current + 1, words[0].length);
  hintEl.dataset.level = next;
  const hints = words.map((w, i) => {
    if (i === 0) return w.substring(0, next) + '_'.repeat(Math.max(0, w.length - next));
    return w[0] + '_'.repeat(w.length - 1);
  });
  hintEl.textContent = '提示：' + hints.join(' ');
  hintEl.style.display = 'block';
}

function switchMode(mode) {
  state.mode = mode;
  render();
}
function toggleRandom() {
  state.random = !state.random;
  render();
}
function clearTabProgress() {
  const items = getItems(state.tab);
  items.forEach(item => {
    const key = `${state.tab}-${item.u}-${DATA[state.tab].indexOf(item)}`;
    delete state.answers[key];
  });
  saveProgress();
  render();
}

function submitGrammar(idx, key, selected) {
  if (state.grammarAnswers[key]) return;
  const items = getItems('grammar');
  const item = items[idx];
  const correct = selected === item.ans;
  state.grammarAnswers[key] = { correct, selected };
  saveProgress();
  render();
}

function submitGrammarFill(idx, key, fillId) {
  if (state.grammarAnswers[key]) return;
  const input = document.getElementById(fillId);
  if (!input) return;
  const val = input.value.trim();
  if (!val) return;
  const items = getItems('grammar');
  const item = items[idx];
  const correct = normalize(val) === normalize(item.ans);
  state.grammarAnswers[key] = { correct, userInput: val };
  saveProgress();
  render();
}

function clearGrammarProgress() {
  const items = getItems('grammar');
  items.forEach(item => {
    const key = `grammar-${item.u}-${DATA.grammar.indexOf(item)}`;

// ========== FLASHCARDS (spaced repetition) ==========
const FC_TYPES = [
  {key:'all', label:'全部'},
  {key:'words', label:'单词'},
  {key:'phrases', label:'词组'},
  {key:'sentences', label:'句子'},
  {key:'grammar', label:'语法'},
];

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fcAudio(t) {
  return ` <button class="tts-btn" style="width:32px;height:32px;font-size:15px;vertical-align:middle;" onclick="event.stopPropagation();speak('${t.replace(/'/g,"\\'")}')">🔊</button>`;
}
function fcId(type, item) { return type + ':' + DATA[type].indexOf(item); }
function fcToday() {
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}
function resetDailyIfNeeded() {
  const today = fcToday();
  if (state.flashDaily.date !== today) state.flashDaily = { date: today, count: 0 };
}
function fcShuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function flashSig() {
  return [state.unit, state.flashType, state.flashStudyAll ? 'all' : 'due',
    state.flashIgnoreLimit ? 'nolim' : 'lim', state.flashLimit, fcToday()].join('|');
}
function flashPool() {
  const types = state.flashType === 'all' ? ['words','phrases','sentences','grammar'] : [state.flashType];
  const pool = [];
  types.forEach(t => {
    getItems(t).forEach(item => pool.push({ item, type: t, id: fcId(t, item) }));
  });
  return pool;
}
function fcDue(card, now) {
  const p = state.flashcards[card.id];
  return !p || (p.next || 0) <= now;
}
function fcSeenToday(card) {
  const today = fcToday();
  return (state.flashcards[card.id] || {}).seen === today;
}
function buildFlashQueue() {
  resetDailyIfNeeded();
  const now = Date.now();
  let cards;
  if (state.flashStudyAll) {
    cards = flashPool();                              // cram: every card, ignore schedule & limit
  } else {
    const due = flashPool().filter(c => fcDue(c, now));
    if (state.flashIgnoreLimit) {
      cards = due;                                    // all due today, ignore daily limit
    } else {
      // forgotten-today cards keep practising freely; new intake capped by remaining quota
      const seenToday = due.filter(c => fcSeenToday(c));
      const fresh = fcShuffle(due.filter(c => !fcSeenToday(c)));
      const remaining = Math.max(0, state.flashLimit - state.flashDaily.count);
      cards = seenToday.concat(fresh.slice(0, remaining));
    }
  }
  fcShuffle(cards);
  state.flashQueue = cards;
  state.flashPos = 0;
  state.flashFlipped = false;
  state.flashRoundDone = 0;
  state.flashSig = flashSig();
}

function renderFlashcards(el) {
  if (state.flashSig !== flashSig()) buildFlashQueue();

  resetDailyIfNeeded();
  const pool = flashPool();
  const now = Date.now();
  const due = pool.filter(c => fcDue(c, now));
  const dueCount = due.length;
  const masteredCount = pool.filter(c => { const p = state.flashcards[c.id]; return p && p.box >= 5; }).length;
  const freshDue = due.filter(c => !fcSeenToday(c)).length; // new cards still locked behind today's limit
  const todayLeft = Math.max(0, state.flashLimit - state.flashDaily.count);

  let head = `<div class="fc-types">`;
  FC_TYPES.forEach(t => {
    head += `<button class="btn btn-outline ${state.flashType===t.key?'active':''}" onclick="setFlashType('${t.key}')">${t.label}</button>`;
  });
  head += `</div>`;
  head += `<div class="fc-types" style="align-items:center;">
      <span style="font-size:13px;color:var(--text-light);">每日新卡：</span>
      <input type="number" min="1" max="999" value="${state.flashLimit}" onchange="setFlashLimit(this.value)"
        style="width:64px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:14px;">
      <span style="font-size:13px;color:var(--text-light);">张 · 今日已学 ${state.flashDaily.count}</span>
    </div>`;
  head += `<div class="stats">
      <span>本组共 ${pool.length} 张</span>
      <span>待复习 ${dueCount}</span>
      <span>已掌握 ${masteredCount}</span>
      <span>本轮剩余 ${Math.max(0, state.flashQueue.length - state.flashPos)}</span>
    </div>`;

  if (state.flashPos >= state.flashQueue.length) {
    if (pool.length === 0) {
      el.innerHTML = head + `<div class="fc-summary"><p style="color:var(--text-light)">该单元没有可用的闪卡内容</p></div>`;
      return;
    }
    // reached today's new-card limit but more new cards remain
    const limitReached = !state.flashStudyAll && !state.flashIgnoreLimit && todayLeft <= 0 && freshDue > 0;
    let msg, primaryBtn;
    if (limitReached) {
      msg = `🎯 今日已学满 ${state.flashLimit} 张，明天继续！还有 ${freshDue} 张新卡待解锁。`;
      primaryBtn = `<button class="btn btn-primary" onclick="continueIgnoreLimit()">继续学习（忽略每日上限）</button>`;
    } else if (dueCount > 0) {
      msg = `本轮完成！标记掌握 ${state.flashRoundDone} 张，还有 ${dueCount} 张待复习。`;
      primaryBtn = `<button class="btn btn-primary" onclick="restartFlash(false)">继续复习</button>`;
    } else {
      msg = state.flashRoundDone > 0 ? `🎉 本轮完成！标记掌握 ${state.flashRoundDone} 张。今日复习已清空。` : '本组暂无待复习的卡片。';
      primaryBtn = `<button class="btn btn-primary" onclick="restartFlash(false)">检查待复习</button>`;
    }
    el.innerHTML = head + `
      <div class="fc-summary">
        <div class="big">${limitReached ? '🎯' : '🎉'}</div>
        <p style="font-size:18px;margin:8px 0;">${msg}</p>
        <div class="controls" style="justify-content:center;">
          ${primaryBtn}
          <button class="btn btn-outline" onclick="restartFlash(true)">复习全部（忽略时间表）</button>
        </div>
      </div>`;
    return;
  }

  const card = state.flashQueue[state.flashPos];
  const it = card.item;
  const isGrammar = card.type === 'grammar';
  const typeLabel = card.type === 'words' ? '单词' : card.type === 'phrases' ? '词组' : card.type === 'sentences' ? '句子' : '语法';

  let frontMain, frontEn = '', frontSmall = false, frontSideLabel;
  let backMain, backEn = '', backExp = '', backSmall = false, backSideLabel;
  if (isGrammar) {
    frontSideLabel = '题目'; backSideLabel = '答案';
    frontMain = it.q; frontSmall = true;
    backMain = it.type === 'choice' ? it.opts[it.ans] : it.ans;
    backExp = it.exp;
  } else if (state.flashDir === 'zh2en') {
    frontSideLabel = '中'; backSideLabel = '英';
    frontMain = it.zh;
    backMain = it.en; backEn = it.en; backSmall = (card.type === 'sentences');
  } else {
    frontSideLabel = '英'; backSideLabel = '中';
    frontMain = it.en; frontEn = it.en; frontSmall = (card.type === 'sentences');
    backMain = it.zh;
  }

  const cardHtml = `<div class="fc-wrap"><div class="fc-card ${state.flashFlipped?'flipped':''}" onclick="flipCard()">
    <div class="fc-inner">
      <div class="fc-face fc-front">
        <span class="fc-tag">${typeLabel} · Unit ${it.u}</span>
        <span class="fc-side">${frontSideLabel}</span>
        <div class="fc-main ${frontSmall?'small':''}">${esc(frontMain)}${frontEn?fcAudio(frontEn):''}</div>
        <span class="fc-hint">点击卡片翻面</span>
      </div>
      <div class="fc-face fc-back">
        <span class="fc-tag">${typeLabel} · Unit ${it.u}</span>
        <span class="fc-side">${backSideLabel}</span>
        <div class="fc-main ${backSmall?'small':''}">${esc(backMain)}${backEn?fcAudio(backEn):''}</div>
        ${backExp?`<div class="fc-exp">${esc(backExp)}</div>`:''}
        <span class="fc-hint">认识程度？</span>
      </div>
    </div>
  </div></div>`;

  const grade = `<div class="fc-grade">
      <button class="btn btn-danger" onclick="gradeCard(false)">✗ 不记得</button>
      <button class="btn btn-success" onclick="gradeCard(true)">✓ 记得</button>
    </div>`;

  const ctrls = `<div class="controls" style="justify-content:center;">
      <button class="btn btn-outline" onclick="flipCard()">翻面</button>
      ${isGrammar?'':`<button class="btn btn-outline" onclick="toggleFlashDir()">方向：${state.flashDir==='zh2en'?'中→英':'英→中'}</button>`}
      <button class="btn btn-warning" onclick="restartFlash(${state.flashStudyAll})">重新开始本组</button>
    </div>`;

  el.innerHTML = head + cardHtml + grade + ctrls;
}

function flipCard() {
  state.flashFlipped = !state.flashFlipped;
  render();
}
function gradeCard(known) {
  const card = state.flashQueue[state.flashPos];
  if (!card) return;
  resetDailyIfNeeded();
  const now = Date.now();
  const today = fcToday();
  const p = state.flashcards[card.id] || { box: 0, next: 0 };
  if (p.seen !== today) state.flashDaily.count++; // count each new card once per day
  p.seen = today;
  if (known) {
    p.box = Math.min(5, (p.box || 0) + 1);
    p.next = now + FC_INTERVALS[p.box];
    state.flashRoundDone++;
  } else {
    p.box = 0;
    p.next = now;
    state.flashQueue.push(card); // see this card again later this round
  }
  state.flashcards[card.id] = p;
  state.flashPos++;
  state.flashFlipped = false;
  saveProgress();
  render();
}
function setFlashType(t) {
  state.flashType = t;
  state.flashStudyAll = false;
  state.flashIgnoreLimit = false;
  buildFlashQueue();
  saveProgress();
  render();
}
function setFlashLimit(v) {
  let n = parseInt(v, 10);
  if (isNaN(n)) return;
  n = Math.max(1, Math.min(999, n));
  state.flashLimit = n;
  state.flashStudyAll = false;
  state.flashIgnoreLimit = false;
  buildFlashQueue();
  saveProgress();
  render();
}
function continueIgnoreLimit() {
  state.flashIgnoreLimit = true;
  state.flashStudyAll = false;
  buildFlashQueue();
  render();
}
function toggleFlashDir() {
  state.flashDir = state.flashDir === 'zh2en' ? 'en2zh' : 'zh2en';
  state.flashFlipped = false;
  saveProgress();
  render();
}
function restartFlash(studyAll) {
  state.flashStudyAll = !!studyAll;
  state.flashIgnoreLimit = false;
  buildFlashQueue();
  render();
}

// ========== READING (朗读训练) ==========
// 录音只保存在内存（Blob URL），刷新后失效；完成状态持久化到 state.readings
const _recs = {};                 // "u:part" -> 录音 Blob URL
let _recRecorder = null, _recStream = null, _recKey = null, _recAudio = null;

function readingsDir(u) { return `7A 单词录音、课文录音/7A Unit${u} 单词录音、课文录音/`; }
function readKey(r) { return r.u + ':' + r.part; }
function micSupported() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}

function renderReading(el) {
  // 切换单元/离开本视图时，自动结束进行中的录音
  if (_recRecorder && _recKey && !READINGS.some(r => readKey(r) === _recKey && (state.unit === 'all' || r.u === state.unit))) {
    stopRecording();
  }
  const units = state.unit === 'all' ? [1,2,3,4,5,6,7,8] : [state.unit];
  let total = 0, done = 0, body = '';
  units.forEach(u => {
    const items = READINGS.filter(r => r.u === u);
    const d = items.filter(r => state.readings[readKey(r)]).length;
    total += items.length; done += d;
    body += `<h3 class="read-unit">Unit ${u} ${READ_UNIT_TITLES[u]}<span>${d}/${items.length} 已朗读</span></h3>
      <div class="progress-bar"><div class="fill" style="width:${items.length ? Math.round(d / items.length * 100) : 0}%"></div></div>`;
    items.forEach(r => { body += readCardHtml(r); });
  });
  el.innerHTML = `<div class="stats">
      <span>🎧 共 ${total} 段教材录音</span>
      <span>✅ 已完成 ${done}</span>
      <span>${micSupported() ? '🎤 可录音跟读对比' : '⚠️ 此浏览器不支持录音，可直接标记完成'}</span>
    </div>${body}`;
}

function readCardHtml(r) {
  const key = readKey(r), done = !!state.readings[key];
  const recing = _recKey === key && _recRecorder;
  return `<div class="read-card ${done ? 'done' : ''} ${recing ? 'recording' : ''}" id="rc-${r.u}-${r.part}">
    <div class="read-head">
      <span class="read-title">${r.title}</span>
      <span class="read-dur" id="dur-${r.u}-${r.part}"></span>
    </div>
    <audio controls preload="metadata" src="${encodeURI(readingsDir(r.u) + r.file)}"
      onloadedmetadata="readShowDur(this,'${r.u}-${r.part}')"></audio>
    <div class="read-actions">
      <button class="btn btn-outline sm" onclick="readSpeed(this,0.75)">🐢 0.75x</button>
      <button class="btn btn-outline sm active" onclick="readSpeed(this,1)">1x</button>
      ${micSupported() ? (recing
        ? `<button class="btn btn-danger" onclick="stopRecording()">⏹️ 停止录音</button>`
        : `<button class="btn btn-primary" onclick="startRecording(${r.u},'${r.part}')">🎙️ 录音跟读</button>`) : ''}
      ${_recs[key] ? `<button class="btn btn-success" onclick="playRecording('${key}')">▶️ 听我的</button>` : ''}
      <button class="btn ${done ? 'btn-outline' : 'btn-success'}" onclick="toggleReadDone(${r.u},'${r.part}')">${done ? '↩️ 取消完成' : '✅ 标记完成'}</button>
    </div>
  </div>`;
}

function readShowDur(a, id) {
  const el = document.getElementById('dur-' + id);
  if (el && isFinite(a.duration) && a.duration > 0) {
    el.textContent = Math.floor(a.duration / 60) + ':' + String(Math.floor(a.duration % 60)).padStart(2, '0');
  }
}
function readSpeed(btn, rate) {
  const a = btn.closest('.read-card').querySelector('audio');
  if (a) a.playbackRate = rate;
  btn.parentElement.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
function toggleReadDone(u, part) {
  const key = u + ':' + part;
  if (state.readings[key]) delete state.readings[key]; else state.readings[key] = true;
  saveProgress();
  render();
}

async function startRecording(u, part) {
  if (_recRecorder) { stopRecording(); return; } // 已在录音：先停止上一段
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    const box = document.getElementById('rc-' + u + '-' + part);
    if (box && !box.querySelector('.read-msg')) {
      const m = document.createElement('div');
      m.className = 'read-msg';
      m.textContent = '⚠️ 无法访问麦克风' + (e && e.name === 'NotAllowedError' ? '（权限被拒绝）' : '') + '，可直接点击「标记完成」';
      box.appendChild(m);
    }
    return;
  }
  const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  const key = u + ':' + part, chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    _recRecorder = null; _recStream = null; _recKey = null;
    if (chunks.length) {
      if (_recs[key]) URL.revokeObjectURL(_recs[key]);
      _recs[key] = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || 'audio/webm' }));
      state.readings[key] = true; // 完成一次跟读即视为已朗读
      saveProgress();
    }
    render();
  };
  _recRecorder = rec; _recStream = stream; _recKey = key;
  rec.start();
  render();
}
function stopRecording() {
  if (_recRecorder && _recRecorder.state !== 'inactive') { _recRecorder.stop(); return; }
  if (_recStream) { _recStream.getTracks().forEach(t => t.stop()); _recStream = null; }
  _recRecorder = null; _recKey = null;
}
function playRecording(key) {
  if (!_recs[key]) return;
  if (_recAudio) _recAudio.pause();
  _recAudio = new Audio(_recs[key]);
  _recAudio.play();
}

// ========== PRINT ==========
function renderPrint(el) {
  let html = `
    <div class="controls no-print">
      <button class="btn btn-primary" onclick="doPrint()">打印中译英填空卷</button>
    </div>
    <div class="card no-print" style="color:var(--text-light);text-align:center;">
      <p>点击上方按钮生成练习卷并打印</p>
      <p style="font-size:13px;margin-top:8px;">范围跟随左侧选中的单元，显示单词、词组与句子</p>
      <p style="font-size:13px;margin-top:4px;">打印时会自动隐藏导航和交互元素，仅显示练习内容</p>
    </div>
    <div class="print-sheet" id="print-sheet"></div>
  `;
  el.innerHTML = html;
}

function doPrint() {
  const sheet = document.getElementById('print-sheet');
  let html = '';
  const unitLabel = state.unit === 'all' ? '全部单元' : `Unit ${state.unit}`;

  html += `<h1 style="text-align:center;font-size:20px;margin-bottom:4px;">7A英语单词复习 · 中译英练习卷</h1>`;
  html += `<p style="text-align:center;font-size:13px;color:#666;margin-bottom:16px;">范围：${unitLabel} · 姓名：__________ · 日期：__________</p>`;

  // Words
  const words = getItems('words');
  if (words.length) {
    html += `<h2>一、单词（共${words.length}个）</h2><div class="print-grid cols-5">`;
    words.forEach((w, i) => {
      html += `<div class="print-cell"><span class="prompt">${i+1}. ${w.zh}</span><div class="write-line"></div></div>`;
    });
    html += `</div>`;
  }

  // Phrases
  const phrases = getItems('phrases');
  if (phrases.length) {
    html += `<h2>二、词组（共${phrases.length}个）</h2><div class="print-grid cols-3">`;
    phrases.forEach((p, i) => {
      html += `<div class="print-cell"><span class="prompt">${i+1}. ${p.zh}</span><div class="write-line"></div></div>`;
    });
    html += `</div>`;
  }

  // Sentences
  const sentences = getItems('sentences');
  if (sentences.length) {
    html += `<h2>三、句子（共${sentences.length}个）</h2>`;
    sentences.forEach((s, i) => {
      html += `<div class="print-item"><span class="prompt">${i+1}. ${s.zh}</span><div class="write-line"></div></div>`;
    });
  }

  sheet.innerHTML = html;
  sheet.style.display = 'block';
  setTimeout(() => window.print(), 200);
  setTimeout(() => { sheet.style.display = 'none'; }, 1000);
}

// ========== RESET ==========
function resetProgress() {
  if (!confirm('确定要重置所有进度吗？此操作不可撤销。')) return;
  state.answers = {};
  state.grammarAnswers = {};
  state.flashcards = {};
  state.flashDaily = { date: '', count: 0 };
  state.flashIgnoreLimit = false;
  state.flashStudyAll = false;
  state.flashQueue = [];
  state.flashPos = 0;
  state.flashSig = '';
  localStorage.removeItem('7a_words_review_progress');
  render();
}

// ========== INIT ==========
loadProgress();
render();
</script>
