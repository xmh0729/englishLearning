<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>6B英语复习</title>
<style>
:root {
  --primary: #2980b9;
  --primary-dark: #1a5276;
  --success: #27ae60;
  --danger: #e74c3c;
  --warning: #f39c12;
  --bg: #f0f2f5;
  --card: #fff;
  --text: #2c3e50;
  --text-light: #7f8c8d;
  --border: #dfe6e9;
  --sidebar-w: 220px;
  --header-h: 56px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }

/* Sidebar */
.sidebar {
  position: fixed; left:0; top:0; bottom:0; width: var(--sidebar-w);
  background: var(--primary-dark); color:#fff; padding-top:16px; z-index:100;
  overflow-y:auto; transition: transform .3s;
}
.sidebar h2 { font-size:18px; padding:0 20px 12px; border-bottom:1px solid rgba(255,255,255,.15); margin-bottom:8px; }
.sidebar .nav-item {
  display:block; padding:10px 20px; cursor:pointer; font-size:14px;
  transition: background .2s; border:none; background:none; color:#fff; width:100%; text-align:left;
}
.sidebar .nav-item:hover, .sidebar .nav-item.active { background: rgba(255,255,255,.15); }
.sidebar .nav-item.active { border-left:3px solid #fff; font-weight:600; }

/* Mobile hamburger */
.hamburger {
  display:none; position:fixed; top:10px; left:10px; z-index:200;
  background:var(--primary-dark); color:#fff; border:none; padding:8px 12px; border-radius:6px; font-size:20px; cursor:pointer;
}
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:99; }

/* Main area */
.main { margin-left: var(--sidebar-w); min-height:100vh; }
.header {
  background: var(--card); height: var(--header-h); display:flex; align-items:center;
  padding:0 24px; border-bottom:1px solid var(--border); gap:8px; flex-wrap:wrap;
  position:sticky; top:0; z-index:50;
}
.tab-btn {
  padding:8px 16px; border:none; background:none; cursor:pointer; font-size:14px; color:var(--text-light);
  border-bottom:2px solid transparent; transition: all .2s;
}
.tab-btn:hover { color:var(--text); }
.tab-btn.active { color:var(--primary); border-bottom-color:var(--primary); font-weight:600; }
.content { padding:24px; max-width:900px; margin:0 auto; }

/* Progress bar */
.progress-bar { background:var(--border); border-radius:10px; height:8px; margin-bottom:16px; overflow:hidden; }
.progress-bar .fill { height:100%; background:var(--success); border-radius:10px; transition: width .4s; }
.stats { display:flex; gap:16px; margin-bottom:20px; font-size:14px; color:var(--text-light); flex-wrap:wrap; }
.stats span { background:var(--card); padding:4px 12px; border-radius:20px; }

/* Controls */
.controls { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
.btn {
  padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-size:13px; transition:all .2s;
}
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:#2471a3; }
.btn-success { background:var(--success); color:#fff; }
.btn-success:hover { background:#219a52; }
.btn-warning { background:var(--warning); color:#fff; }
.btn-warning:hover { background:#d68910; }
.btn-danger { background:var(--danger); color:#fff; }
.btn-danger:hover { background:#c0392b; }
.btn-outline { background:none; border:1px solid var(--border); color:var(--text); }
.btn-outline:hover { background:var(--bg); }
.btn-outline.active { border-color:var(--primary); color:var(--primary); background:rgba(41,128,185,.08); }

/* Card */
.card {
  background:var(--card); border-radius:12px; padding:24px; margin-bottom:16px;
  box-shadow:0 1px 3px rgba(0,0,0,.08); border:1px solid var(--border);
}
.card .label { font-size:12px; color:var(--text-light); margin-bottom:4px; }
.card .zh { font-size:18px; margin-bottom:12px; line-height:1.5; }
.card .input-row { display:flex; gap:8px; align-items:center; }
.card input[type=text] {
  flex:1; padding:10px 14px; border:2px solid var(--border); border-radius:8px; font-size:16px;
  outline:none; transition: border-color .2s;
}
.card input[type=text]:focus { border-color:var(--primary); }
.card input.correct { border-color:var(--success); background:#eafaf1; }
.card input.wrong { border-color:var(--danger); background:#fdedec; }
.answer-display { margin-top:8px; font-size:14px; }
.answer-display.correct { color:var(--success); }
.answer-display.wrong { color:var(--danger); }

/* TTS button */
.tts-btn {
  width:40px; height:40px; border:none; background:var(--primary); color:#fff;
  border-radius:50%; font-size:18px; cursor:pointer; flex-shrink:0; transition:background .2s;
}
.tts-btn:hover { background:#2471a3; }

/* Grammar */
.grammar-card { background:var(--card); border-radius:12px; padding:20px; margin-bottom:12px; border:1px solid var(--border); }
.grammar-card .question { font-size:16px; margin-bottom:12px; line-height:1.6; }
.grammar-card .options { display:flex; flex-direction:column; gap:8px; }
.grammar-card .option-btn {
  padding:10px 16px; border:2px solid var(--border); border-radius:8px; background:var(--card);
  cursor:pointer; font-size:14px; text-align:left; transition:all .2s;
}
.grammar-card .option-btn:hover { border-color:var(--primary); background:rgba(41,128,185,.05); }
.grammar-card .option-btn.selected-correct { border-color:var(--success); background:#eafaf1; }
.grammar-card .option-btn.selected-wrong { border-color:var(--danger); background:#fdedec; }
.grammar-card .option-btn.show-correct { border-color:var(--success); background:#eafaf1; }
.grammar-card .option-btn.disabled { pointer-events:none; opacity:.7; }
.grammar-card .explanation { margin-top:10px; padding:10px; background:#fef9e7; border-radius:6px; font-size:13px; color:#7d6608; display:none; }
.grammar-card .fill-input { width:200px; padding:8px 12px; border:2px solid var(--border); border-radius:6px; font-size:15px; outline:none; }
.grammar-card .fill-input:focus { border-color:var(--primary); }
.grammar-card .fill-input.correct { border-color:var(--success); background:#eafaf1; }
.grammar-card .fill-input.wrong { border-color:var(--danger); background:#fdedec; }

/* Summary */
.summary { text-align:center; padding:40px 20px; }
.summary .score { font-size:48px; font-weight:700; color:var(--primary); }
.summary .detail { font-size:16px; color:var(--text-light); margin-top:8px; }

/* Print styles */
@media print {
  .sidebar, .hamburger, .overlay, .header, .controls, .progress-bar, .stats, .btn, .tts-btn, .no-print { display:none!important; }
  .main { margin-left:0!important; }
  .content { padding:10px; max-width:100%; }
  .print-sheet { display:block!important; }
  .print-sheet h2 { font-size:16px; margin:16px 0 8px; border-bottom:1px solid #333; padding-bottom:4px; }
  .print-sheet .print-item { padding:8px 0; border-bottom:1px dashed #ccc; page-break-inside:avoid; }
  .print-sheet .print-item .prompt { font-size:14px; }
  .print-sheet .print-item .write-line { border-bottom:1px solid #999; height:32px; margin-top:4px; }
  body { background:#fff; font-size:12px; }
}
.print-sheet { display:none; }

/* Responsive */
@media (max-width:768px) {
  .sidebar { transform:translateX(-100%); }
  .sidebar.open { transform:translateX(0); }
  .overlay.show { display:block; }
  .hamburger { display:block; }
  .main { margin-left:0; }
  .header { padding:0 12px 0 50px; }
  .content { padding:16px; }
  .card .zh { font-size:16px; }
}
</style>

grammar: [
  // Unit 1: 副词
  {u:1, type:"choice", q:"选出正确的副词形式：slow → ____", opts:["slowly","slowily","slowy","slowlly"], ans:0, exp:"大部分副词由形容词加 -ly 构成：slow → slowly"},
  {u:1, type:"choice", q:"happy 的副词形式是？", opts:["happyly","happily","hapily","happilly"], ans:1, exp:"以 -y 结尾的形容词，变 y 为 i 再加 -ly：happy → happily"},
  {u:1, type:"choice", q:"下列哪个词的副词和形容词同形？", opts:["quick","quiet","fast","slow"], ans:2, exp:"fast 形容词和副词同形：He runs fast."},
  {u:1, type:"choice", q:"\"She sings ____.\" 填入 beautiful 的副词形式", opts:["beautiful","beautifully","beautifuly","beautifulily"], ans:1, exp:"beautiful + ly = beautifully"},
  {u:1, type:"choice", q:"\"The boy ran ____ to school.\" 选择正确的词", opts:["quick","quickly","quicking","quickily"], ans:1, exp:"修饰动词 ran 需要用副词 quickly"},
  {u:1, type:"fill", q:"用 loud 的副词形式填空：He laughed ____.", ans:"loudly", exp:"loud + ly = loudly（大声地）"},
  {u:1, type:"fill", q:"用 easy 的副词形式填空：She can do it ____.", ans:"easily", exp:"easy 以 y 结尾，变 y 为 i 加 ly = easily"},
  {u:1, type:"fill", q:"用 sad 的副词形式填空：He looked at me ____.", ans:"sadly", exp:"sad + ly = sadly"},
  {u:1, type:"choice", q:"\"He works very ____.\" hard 在此处是什么词性？", opts:["形容词","副词","名词","动词"], ans:1, exp:"hard 作副词，修饰动词 works，意为\"努力地\""},
  {u:1, type:"choice", q:"下列哪个不是副词？", opts:["quickly","happily","strong","loudly"], ans:2, exp:"strong 是形容词（强壮的），副词形式是 strongly"},

  // Unit 2: 频率副词
  {u:2, type:"choice", q:"频率副词在句中的正确位置是？", opts:["句子末尾","实意动词之前，be动词之后","句子开头","任意位置"], ans:1, exp:"频率副词放在实意动词之前、be动词/助动词/情态动词之后"},
  {u:2, type:"choice", q:"\"He ____ gets up early.\" 选择最佳位置的频率副词", opts:["always","is always","always is","does always"], ans:0, exp:"always 放在实意动词 gets 之前"},
  {u:2, type:"choice", q:"\"She is ____ late for school.\" 填入频率副词", opts:["never","doesn't never","never is","not never"], ans:0, exp:"频率副词放在 be 动词之后：She is never late."},
  {u:2, type:"choice", q:"How often 用来提问什么？", opts:["时间长度","频率","距离","次数"], ans:1, exp:"How often 对频率副词提问，如 always, often, every day 等"},
  {u:2, type:"choice", q:"\"____ do you visit your grandma?\" \"Twice a month.\"", opts:["How often","How long","How soon","How far"], ans:0, exp:"回答是频率 twice a month，所以用 How often"},
  {u:2, type:"choice", q:"\"____ will you come back?\" \"In an hour.\"", opts:["How often","How long","How soon","How far"], ans:2, exp:"回答是 In + 时间段，用 How soon（还要多久）"},
  {u:2, type:"choice", q:"\"____ is it from your school?\" \"About 3 km.\"", opts:["How often","How long","How soon","How far"], ans:3, exp:"回答是距离 3 km，用 How far"},
  {u:2, type:"choice", q:"\"____ do you spend reading?\" \"About an hour.\"", opts:["How often","How long","How soon","How far"], ans:1, exp:"回答是一段时间 an hour，用 How long"},
  {u:2, type:"fill", q:"\"Do you often go there?\" \"Yes, I ____ do.\"", ans:"often", exp:"在答句中，频率副词放在助动词之前"},
  {u:2, type:"choice", q:"sometimes 在句中可以放在哪里？", opts:["只能放句中","只能放句首","只能放句末","句首、句中、句末都可以"], ans:3, exp:"sometimes 位置灵活，句首、句中、句末均可"},

  // Unit 3: a few / a little / too much / too many
  {u:3, type:"choice", q:"\"a few\" 后面接什么名词？", opts:["不可数名词","可数名词复数","可数名词单数","任何名词"], ans:1, exp:"a few 后接可数名词复数，如 a few eggs"},
  {u:3, type:"choice", q:"\"a little\" 后面接什么名词？", opts:["不可数名词","可数名词复数","可数名词单数","任何名词"], ans:0, exp:"a little 后接不可数名词，如 a little water"},
  {u:3, type:"choice", q:"\"He has ____ eggs every week.\" 选择正确的词", opts:["a little","a few","much","a lot"], ans:1, exp:"eggs 是可数名词复数，用 a few"},

// ========== STATE ==========
let state = {
  unit: 'all',
  tab: 'words',
  mode: 'zh2en', // zh2en or listen
  random: false,
  currentItems: [],
  currentIndex: 0,
  answers: {}, // key: "tab-unit-index" -> {correct:bool}
  grammarAnswers: {},
};

// Load progress from localStorage
function loadProgress() {
  try {
    const saved = localStorage.getItem('6b_review_progress');
    if (saved) {
      const p = JSON.parse(saved);
      state.answers = p.answers || {};
      state.grammarAnswers = p.grammarAnswers || {};
    }
  } catch(e) {}
}
function saveProgress() {
  try {
    localStorage.setItem('6b_review_progress', JSON.stringify({
      answers: state.answers,
      grammarAnswers: state.grammarAnswers,
    }));
  } catch(e) {}
}

// ========== NAVIGATION ==========
function selectUnit(u) {
  state.unit = u;
  if (u === 'dictation') {
    state.tab = 'dictation';
    document.querySelector('.header').style.display = 'none';
  } else {
    if (state.tab === 'dictation') state.tab = 'words';
    document.querySelector('.header').style.display = '';
  }
  document.querySelectorAll('.sidebar .nav-item').forEach((el, i) => {
    el.classList.toggle('active', (u === 'all' && i === 0) || (u === i) || (u === 'dictation' && el.textContent.includes('专项默写')));
  });
  if (window.innerWidth < 768) toggleSidebar();
  render();
}
function selectTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.tab-btn').forEach(el => {
    el.classList.toggle('active', el.textContent.includes(
      tab === 'words' ? '单词' : tab === 'phrases' ? '词组' : tab === 'sentences' ? '句子' : tab === 'grammar' ? '语法' : '打印'
    ));
  });
  render();
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

// ========== FILTERING ==========
function getItems(tab) {
  if (tab === 'dictation') return [...DATA.dictation];
  const src = DATA[tab] || [];
  return state.unit === 'all' ? [...src] : src.filter(i => i.u === state.unit);
}

// ========== ANSWER CHECKING ==========
function normalize(s) {
  return s.toLowerCase().replace(/['']/g, "'").replace(/[""]/g, '"').replace(/\s+/g, ' ').replace(/[.,!?;:，。！？；：、]+$/g, '').trim();
}
function checkAnswer(input, expected) {
  const a = normalize(input);
  const b = normalize(expected);
  if (a === b) return true;
  // Also check without any punctuation
  const a2 = a.replace(/[^a-z0-9\s]/g, '');
  const b2 = b.replace(/[^a-z0-9\s]/g, '');
  return a2 === b2;
}

// ========== TTS ==========
// TTS: cache English voice
let _enVoice = null;
let _voicesLoaded = false;
function loadVoices() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  _voicesLoaded = true;
  // Prefer high-quality voices: Samantha (macOS), Google US English, any en-US, any en
  const prefs = [
    v => v.name.includes('Samantha'),
    v => v.name.includes('Google') && v.lang.startsWith('en'),
    v => v.name.includes('Natural') && v.lang.startsWith('en'),
    v => v.lang === 'en-US' && !v.name.includes('Compact'),
    v => v.lang === 'en-GB' && !v.name.includes('Compact'),
    v => v.lang.startsWith('en-'),
    v => v.lang.startsWith('en'),
  ];
  for (const test of prefs) {
    const found = voices.find(test);
    if (found) { _enVoice = found; return; }
  }
}
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  if (!_voicesLoaded) loadVoices();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.85;
  u.pitch = 1;
  if (_enVoice) u.voice = _enVoice;
  speechSynthesis.speak(u);
}

// ========== RENDER ==========
function render() {
  const el = document.getElementById('content');
  if (state.tab === 'print') return renderPrint(el);
  if (state.tab === 'grammar') return renderGrammar(el);
  if (state.tab === 'dictation') return renderDictation(el);
  renderDictation(el);
}

function renderDictation(el) {
  const items = getItems(state.tab);
  if (state.random) {
    // Shuffle using Fisher-Yates but with a seed from current selection to stay stable
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [items[i], items[j]] = [items[j], items[i]];
    }
  }
  state.currentItems = items;

  const isDictation = state.tab === 'dictation';
  const total = items.length;
  const getKey = (item) => {
    if (isDictation) return `dictation-0-${DATA.dictation.indexOf(item)}`;
    return `${state.tab}-${item.u}-${DATA[state.tab].indexOf(item)}`;
  };
  const answered = items.filter(item => state.answers[getKey(item)] !== undefined).length;
  const correct = items.filter(item => state.answers[getKey(item)]?.correct).length;

  const pct = total > 0 ? Math.round(answered / total * 100) : 0;
  const tabLabel = isDictation ? '默写' : state.tab === 'words' ? '单词' : state.tab === 'phrases' ? '词组' : '句子';

  let html = `
    <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
    <div class="stats">
      <span>共 ${total} 个${tabLabel}</span>
      <span>已完成 ${answered}/${total}</span>
      <span>正确率 ${answered > 0 ? Math.round(correct/answered*100) : 0}%</span>
    </div>
    <div class="controls">
      <button class="btn btn-outline ${state.mode==='zh2en'?'active':''}" onclick="switchMode('zh2en')">看中文写英文</button>
      <button class="btn btn-outline ${state.mode==='listen'?'active':''}" onclick="switchMode('listen')">听英文写英文</button>
      <button class="btn btn-outline ${state.random?'active':''}" onclick="toggleRandom()">随机顺序</button>
      <button class="btn btn-warning" onclick="clearTabProgress()">重做本组</button>
    </div>
  `;

  items.forEach((item, idx) => {
    const key = getKey(item);
    const answered = state.answers[key];
    const inputId = `input-${idx}`;

    html += `<div class="card" id="card-${idx}">`;
    html += `<div class="label">${isDictation ? '专项默写' : 'Unit ' + item.u} · #${idx+1}</div>`;

    if (state.mode === 'zh2en') {
      html += `<div class="zh">${item.zh}</div>`;
    } else {
      html += `<div class="zh" style="color:var(--text-light);font-size:14px;">点击喇叭听英文，写出你听到的内容</div>`;
    }

    html += `<div class="input-row">`;
    if (state.mode === 'listen') {
      html += `<button class="tts-btn" onclick="speak('${item.en.replace(/'/g, "\\'")}')">🔊</button>`;
    }
    html += `<input type="text" id="${inputId}" placeholder="输入英文..."
      ${answered ? 'disabled' : ''}
      class="${answered ? (answered.correct ? 'correct' : 'wrong') : ''}"
      ${answered ? `value="${answered.userInput || ''}"` : ''}
      onkeydown="if(event.key==='Enter')submitAnswer(${idx},'${key}','${inputId}')">`;
    if (!answered) {
      html += `<button class="btn btn-primary" onclick="submitAnswer(${idx},'${key}','${inputId}')">确认</button>`;
      if (state.tab === 'sentences' || isDictation) {
        html += `<button class="btn btn-outline" onclick="showHint(${idx})">提示</button>`;
      }
    }
    html += `</div>`; // input-row

    if (answered) {
      if (answered.correct) {
        html += `<div class="answer-display correct">✓ 正确！</div>`;
      } else {
        html += `<div class="answer-display wrong">✗ 正确答案：${item.en}</div>`;
      }
    }

    // Hint area for sentences and dictation
    if ((state.tab === 'sentences' || isDictation) && !answered) {
      html += `<div id="hint-${idx}" class="answer-display" style="color:var(--warning);display:none;"></div>`;
    }

    html += `</div>`; // card
  });

  if (total === 0) {
    html += `<div style="text-align:center;padding:40px;color:var(--text-light);">该单元没有此类型的内容</div>`;
  }

  el.innerHTML = html;
}

function submitAnswer(idx, key, inputId) {
  const input = document.getElementById(inputId);
  if (!input) return;
  const userInput = input.value.trim();
  if (!userInput) return;
  const item = state.currentItems[idx];
  const correct = checkAnswer(userInput, item.en);
  state.answers[key] = { correct, userInput };
  saveProgress();
  render();
  // Scroll to next unanswered
  setTimeout(() => {
    const cards = document.querySelectorAll('.card');
    for (let i = idx + 1; i < cards.length; i++) {
      const inp = cards[i].querySelector('input:not([disabled])');
      if (inp) { inp.focus(); inp.scrollIntoView({behavior:'smooth', block:'center'}); break; }
    }
  }, 100);
}

function showHint(idx) {
  const item = state.currentItems[idx];
  const hintEl = document.getElementById(`hint-${idx}`);
  if (!hintEl) return;
  const words = item.en.split(' ');
  const current = hintEl.dataset.level ? parseInt(hintEl.dataset.level) : 0;
  const next = Math.min(current + 1, words[0].length);
  hintEl.dataset.level = next;
  const hints = words.map((w, i) => {
    if (i === 0) return w.substring(0, next) + '_'.repeat(Math.max(0, w.length - next));
    return w[0] + '_'.repeat(w.length - 1);
  });
  hintEl.textContent = '提示：' + hints.join(' ');
  hintEl.style.display = 'block';
}

function switchMode(mode) {
  state.mode = mode;
  render();
}
function toggleRandom() {
  state.random = !state.random;
  render();
}
function clearTabProgress() {
  const items = getItems(state.tab);
  const isDictation = state.tab === 'dictation';
  items.forEach(item => {
    const key = isDictation ? `dictation-0-${DATA.dictation.indexOf(item)}` : `${state.tab}-${item.u}-${DATA[state.tab].indexOf(item)}`;
    delete state.answers[key];
  });
  saveProgress();
  render();
}

// ========== GRAMMAR ==========
function renderGrammar(el) {
  const items = getItems('grammar');
  const total = items.length;
  const answered = items.filter(item => {
    const key = `grammar-${item.u}-${DATA.grammar.indexOf(item)}`;
    return state.grammarAnswers[key] !== undefined;
  }).length;
  const correct = items.filter(item => {
    const key = `grammar-${item.u}-${DATA.grammar.indexOf(item)}`;
    return state.grammarAnswers[key]?.correct;
  }).length;
  const pct = total > 0 ? Math.round(answered / total * 100) : 0;

  let html = `
    <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
    <div class="stats">
      <span>共 ${total} 题</span>
      <span>已完成 ${answered}/${total}</span>
      <span>正确率 ${answered > 0 ? Math.round(correct/answered*100) : 0}%</span>
    </div>
    <div class="controls">
      <button class="btn btn-warning" onclick="clearGrammarProgress()">重做本组</button>
    </div>
  `;

  items.forEach((item, idx) => {
    const globalIdx = DATA.grammar.indexOf(item);
    const key = `grammar-${item.u}-${globalIdx}`;
    const answered = state.grammarAnswers[key];

    html += `<div class="grammar-card">`;
    html += `<div class="label">Unit ${item.u} · 第${idx+1}题 · ${item.type==='choice'?'选择题':'填空题'}</div>`;
    html += `<div class="question">${item.q}</div>`;

    if (item.type === 'choice') {
      html += `<div class="options">`;
      item.opts.forEach((opt, oi) => {
        let cls = '';
        if (answered) {
          cls = 'disabled';
          if (oi === answered.selected) cls += answered.correct ? ' selected-correct' : ' selected-wrong';
          if (oi === item.ans && !answered.correct) cls += ' show-correct';
        }
        html += `<button class="option-btn ${cls}" onclick="submitGrammar(${idx},'${key}',${oi})">${String.fromCharCode(65+oi)}. ${opt}</button>`;
      });
      html += `</div>`;
    } else {
      // fill
      const fillId = `fill-${idx}`;
      html += `<div class="input-row" style="margin-top:8px;">`;
      html += `<input type="text" class="fill-input ${answered ? (answered.correct ? 'correct' : 'wrong') : ''}"
        id="${fillId}" placeholder="填写答案..."
        ${answered ? `disabled value="${answered.userInput || ''}"` : ''}
        onkeydown="if(event.key==='Enter')submitGrammarFill(${idx},'${key}','${fillId}')">`;
      if (!answered) {
        html += `<button class="btn btn-primary" onclick="submitGrammarFill(${idx},'${key}','${fillId}')">确认</button>`;
      }
      html += `</div>`;
      if (answered && !answered.correct) {
        html += `<div class="answer-display wrong" style="margin-top:6px;">正确答案：${item.ans}</div>`;
      }
    }

    html += `<div class="explanation" id="exp-${idx}" style="${answered ? 'display:block' : ''}">${item.exp}</div>`;
    html += `</div>`;
  });

  if (total === 0) {
    html += `<div style="text-align:center;padding:40px;color:var(--text-light);">该单元没有语法练习</div>`;
  }

  el.innerHTML = html;
}

function submitGrammar(idx, key, selected) {
  if (state.grammarAnswers[key]) return;
  const items = getItems('grammar');
  const item = items[idx];
  const correct = selected === item.ans;
  state.grammarAnswers[key] = { correct, selected };
  saveProgress();
  render();
}

function submitGrammarFill(idx, key, fillId) {
  if (state.grammarAnswers[key]) return;
  const input = document.getElementById(fillId);
  if (!input) return;
  const val = input.value.trim();
  if (!val) return;
  const items = getItems('grammar');
  const item = items[idx];
  const correct = normalize(val) === normalize(item.ans);
  state.grammarAnswers[key] = { correct, userInput: val };
  saveProgress();
  render();
}

function clearGrammarProgress() {
  const items = getItems('grammar');
  items.forEach(item => {
    const key = `grammar-${item.u}-${DATA.grammar.indexOf(item)}`;
    delete state.grammarAnswers[key];
  });
  saveProgress();
  render();
}

// ========== PRINT ==========
function renderPrint(el) {
  let html = `
    <div class="controls no-print">
      <button class="btn btn-primary" onclick="doPrint('zh2en')">打印中译英填空卷</button>
      <button class="btn btn-success" onclick="doPrint('grammar')">打印语法练习卷</button>
    </div>
    <div class="card no-print" style="color:var(--text-light);text-align:center;">
      <p>点击上方按钮生成练习卷并打印</p>
      <p style="font-size:13px;margin-top:8px;">打印时会自动隐藏导航和交互元素，仅显示练习内容</p>
    </div>
    <div class="print-sheet" id="print-sheet"></div>
  `;
  el.innerHTML = html;
}

function doPrint(type) {
  const sheet = document.getElementById('print-sheet');
  let html = '';
  const unitLabel = state.unit === 'all' ? '全部单元' : `Unit ${state.unit}`;

  if (type === 'zh2en') {
    html += `<h1 style="text-align:center;font-size:20px;margin-bottom:4px;">6B英语复习 · 中译英练习卷</h1>`;
    html += `<p style="text-align:center;font-size:13px;color:#666;margin-bottom:16px;">范围：${unitLabel} · 姓名：__________ · 日期：__________</p>`;

    // Words
    const words = getItems('words');
    if (words.length) {
      html += `<h2>一、单词（共${words.length}个）</h2>`;
      words.forEach((w, i) => {
        html += `<div class="print-item"><span class="prompt">${i+1}. ${w.zh}</span><div class="write-line"></div></div>`;
      });
    }

    // Phrases
    const phrases = getItems('phrases');
    if (phrases.length) {
      html += `<h2>二、词组（共${phrases.length}个）</h2>`;
      phrases.forEach((p, i) => {
        html += `<div class="print-item"><span class="prompt">${i+1}. ${p.zh}</span><div class="write-line"></div></div>`;
      });
    }

    // Sentences
    const sentences = getItems('sentences');
    if (sentences.length) {
      html += `<h2>三、句子（共${sentences.length}个）</h2>`;
      sentences.forEach((s, i) => {
        html += `<div class="print-item"><span class="prompt">${i+1}. ${s.zh}</span><div class="write-line"></div><div class="write-line"></div></div>`;
      });
    }
  } else {
    // Grammar
    html += `<h1 style="text-align:center;font-size:20px;margin-bottom:4px;">6B英语复习 · 语法练习卷</h1>`;
    html += `<p style="text-align:center;font-size:13px;color:#666;margin-bottom:16px;">范围：${unitLabel} · 姓名：__________ · 日期：__________</p>`;

    const grammar = getItems('grammar');
    const choices = grammar.filter(g => g.type === 'choice');
    const fills = grammar.filter(g => g.type === 'fill');

    if (choices.length) {
      html += `<h2>一、选择题（共${choices.length}题）</h2>`;
      choices.forEach((g, i) => {
        html += `<div class="print-item"><span class="prompt">${i+1}. ${g.q}</span><br>`;
        g.opts.forEach((o, oi) => {
          html += `<span style="margin-left:16px;">${String.fromCharCode(65+oi)}. ${o}</span>&nbsp;&nbsp;`;
        });
        html += `<div class="write-line" style="height:20px;"></div></div>`;
      });
    }

    if (fills.length) {
      html += `<h2>二、填空题（共${fills.length}题）</h2>`;
      fills.forEach((g, i) => {
        html += `<div class="print-item"><span class="prompt">${i+1}. ${g.q}</span><div class="write-line"></div></div>`;
      });
    }
  }

  sheet.innerHTML = html;
  sheet.style.display = 'block';
  setTimeout(() => window.print(), 200);
  setTimeout(() => { sheet.style.display = 'none'; }, 1000);
}

// ========== RESET ==========
function resetProgress() {
  if (!confirm('确定要重置所有进度吗？此操作不可撤销。')) return;
  state.answers = {};
  state.grammarAnswers = {};
  localStorage.removeItem('6b_review_progress');
  render();
}

// ========== INIT ==========
loadProgress();
render();
</script>
